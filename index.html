<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="旅行计划">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="description" content="个人专属旅行计划工具：行程规划、目的地收藏、预算记录、飞行里程、旅行小记">
  <title>旅行计划</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="shortcut icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- 高德地图 JS API -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: '4b210a61c0bd0bb7bbe36387118adf3b',
    };
  </script>
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=74815b9953b78fadc96115b7ac17b933&plugin=AMap.Geocoder,AMap.PlaceSearch,AMap.Geolocation"></script>

  <style>
    :root {
      --primary: #2d6a4f;          /* 森林绿 */
      --primary-dark: #1b4332;
      --primary-light: #95d5b2;
      --primary-bg: #d8f3dc;
      --accent: #74c69d;            /* 草绿 */
      --success: #2d6a4f;
      --success-bg: #d8f3dc;
      --warning: #b08968;           /* 木棕，用于提醒 */
      --warning-bg: #f3e9dd;
      --danger: #b56576;            /* 暗红，用于危险操作 */
      --danger-bg: #f5e6e9;
      --purple: #2d6a4f;            /* 统一到绿色，去掉紫色 */
      --purple-bg: #d8f3dc;
      --text-1: #1a1a1a;
      --text-2: #6b7280;
      --text-3: #9ca3af;
      --bg: #faf9f7;                /* 米白底 */
      --card: #ffffff;
      --border: #ececec;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(0,0,0,0.03);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      padding-bottom: calc(88px + var(--safe-bottom));
    }

    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* 顶部栏 */
    .top-bar {
      padding: 18px 18px 14px;
      background: var(--card);
      color: var(--text-1);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar .subtitle { font-size: 13px; color: var(--text-2); margin-bottom: 2px; }
    .top-bar .title-row { display: flex; align-items: center; justify-content: space-between; }
    .top-bar h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .top-bar .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .top-bar .icon-btn svg { width: 22px; height: 22px; stroke: var(--text-2); }

    .page-header { padding: 18px 18px 10px; }
    .page-header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .page-header .subtitle { font-size: 13px; color: var(--text-2); margin-top: 2px; }

    .content { padding: 0 16px 20px; }

    /* 卡片 */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-header h2 { font-size: 16px; font-weight: 600; }
    .card-header .more { font-size: 13px; color: var(--primary); cursor: pointer; font-weight: 500; }

    /* 首页 Hero */
    .hero-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .hero-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--text-1);
      border: 1px solid var(--border);
    }
    .hero-card .label { font-size: 11px; color: var(--text-2); margin-bottom: 4px; }
    .hero-card .value { font-size: 26px; font-weight: 700; letter-spacing: -1px; color: var(--primary); }
    .hero-card .sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    /* 指标条 */
    .stat-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    .stat-pill {
      background: var(--card); border-radius: 12px;
      padding: 12px 6px; text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-pill .num { font-size: 20px; font-weight: 700; color: var(--primary); }
    .stat-pill .label { font-size: 11px; color: var(--text-2); margin-top: 2px; }

    /* 按钮 */
    .btn {
      border: none; outline: none; cursor: pointer;
      font-family: inherit; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 18px; border-radius: 12px; font-size: 14px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--bg); color: var(--text-1); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 12px; font-size: 12px; }

    /* FAB */
    .fab {
      position: fixed; bottom: calc(92px + var(--safe-bottom)); right: 18px;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--primary);
      color: white; border: none; box-shadow: 0 2px 12px rgba(45,106,79,0.25);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 250;
    }
    .fab svg { width: 26px; height: 26px; stroke: white; }

    /* 列表项 */
    .list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: none; }
    .list-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 20px;
    }
    .list-icon svg { width: 22px; height: 22px; stroke: var(--primary); }
    .list-body { flex: 1; min-width: 0; }
    .list-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .list-desc { font-size: 12px; color: var(--text-2); }
    .list-meta { font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .list-arrow { color: var(--text-3); }

    /* 标签 */
    .tag {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .tag-planning { background: var(--primary-bg); color: var(--primary); }
    .tag-ongoing { background: var(--success-bg); color: var(--success); }
    .tag-completed { background: var(--border); color: var(--text-2); }
    .tag-wish { background: var(--purple-bg); color: var(--purple); }

    /* 表单 */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-2); }
    .form-input, .form-textarea, .form-select {
      width: 100%; border: 1px solid var(--border); background: var(--bg);
      border-radius: var(--radius-sm); padding: 12px 14px;
      font-size: 15px; font-family: inherit; color: var(--text-1); outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary-light); background: var(--card); }
    .form-textarea { min-height: 90px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* 空状态 */
    .empty { text-align: center; padding: 50px 20px; color: var(--text-3); }
    .empty svg { margin-bottom: 12px; stroke: var(--text-3); }
    .empty .title { font-size: 15px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
    .empty .desc { font-size: 13px; }

    /* 底部 Tab */
    .tab-bar {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%); width: 100%; max-width: 430px;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex; padding: 8px 0 calc(8px + var(--safe-bottom));
      z-index: 200;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer; padding: 4px 0;
    }
    .tab-icon { width: 24px; height: 24px; }
    .tab-icon svg { width: 24px; height: 24px; stroke: var(--text-3); }
    .tab-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
    .tab-item.active .tab-label { color: var(--primary); }
    .tab-item.active .tab-icon svg { stroke: var(--primary); }

    /* 弹窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 400; display: none; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card); width: 100%; max-width: 430px;
      border-radius: 20px 20px 0 0;
      padding: 20px; max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 24px; color: var(--text-3); cursor: pointer; }

    /* 媒体上传预览 */
    .media-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .media-item {
      aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden;
      background: var(--bg); position: relative; cursor: pointer;
    }
    .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
    .media-add {
      aspect-ratio: 1; border-radius: var(--radius-sm); border: 2px dashed var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-3); cursor: pointer; gap: 4px;
    }
    .media-add svg { stroke: var(--text-3); }

    .media-add svg { width: 28px; height: 28px; stroke: var(--text-3); }
    .media-add span { font-size: 11px; }

    /* 进度条 */
    .progress-bar {
      height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

    /* 菜单 */
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary-bg);
    }
    .menu-icon svg { stroke: var(--primary); }
    .menu-label { flex: 1; font-size: 14px; }
    .menu-arrow { color: var(--text-3); }

    /* 行程详情 */
    .day-card {
      background: var(--bg); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px;
    }
    .day-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .activity-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e5e7eb;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-time { font-size: 12px; color: var(--text-3); width: 50px; flex-shrink: 0; }
    .activity-body { flex: 1; }
    .activity-title { font-size: 13px; font-weight: 500; }
    .activity-desc { font-size: 11px; color: var(--text-2); }

    /* 地图容器 */
    #travelMap, #homeMap { border-radius: var(--radius); overflow: hidden; }

    /* 清单模块 */
    .scene-card {
      display: inline-flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 14px; border-radius: 14px; min-width: 80px;
      cursor: pointer; transition: all 0.2s;
      border: 2px solid transparent;
    }
    .scene-card.active { border-color: var(--primary); }
    .scene-card-icon { width: 28px; height: 28px; }
    .scene-card-icon svg { width: 28px; height: 28px; }
    .scene-card-name { font-size: 11px; font-weight: 600; white-space: nowrap; }

    .check-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .check-item:last-child { border-bottom: none; }
    .check-box {
      width: 22px; height: 22px; border-radius: 6px;
      border: 2px solid var(--text-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .check-box.checked {
      background: var(--primary); border-color: var(--primary);
      color: white;
    }
    .check-box.checked svg { stroke: white; }
    .check-name { font-size: 14px; flex: 1; }
    .check-name.checked { color: var(--text-3); text-decoration: line-through; }
    .check-actions { display: flex; gap: 4px; }

    /* 隐藏滚动条 */
    ::-webkit-scrollbar { display: none; }

    /* 小记卡片 */
    .diary-card { margin-bottom: 14px; }
    .diary-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .diary-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 600; font-size: 14px;
    }
    .diary-meta { flex: 1; }
    .diary-title { font-size: 14px; font-weight: 600; }
    .diary-date { font-size: 11px; color: var(--text-3); }
    .diary-content { font-size: 14px; line-height: 1.7; color: var(--text-1); margin-bottom: 10px; }
    .diary-media { display: flex; gap: 8px; overflow-x: auto; }
    .diary-media img, .diary-media video { height: 120px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }

    /* toast */
    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75); color: white; padding: 12px 20px;
      border-radius: 10px; font-size: 14px; z-index: 500;
      display: none; pointer-events: none;
    }
    .toast.show { display: block; animation: fadeIn 0.2s ease; }
  </style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ===== 图标 SVG =====
const ICONS = {

// ===== IndexedDB 媒体存储 =====
function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('TravelAppDB', 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => resolve(request.result);
    request.onupgradeneeded = (event) => {
      const database = event.target.result;
      if (!database.objectStoreNames.contains('media')) {
        database.createObjectStore('media', { keyPath: 'id' });
      }
    };
  });
}

async function saveMedia(id, blob) {
  if (!db) return;
  const tx = db.transaction('media', 'readwrite');
  const store = tx.objectStore('media');
  const ab = await blob.arrayBuffer();
  store.put({ id, data: ab, type: blob.type });
  return new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function loadMedia(id) {
  if (!db) return null;
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readonly');
    const store = tx.objectStore('media');
    const req = store.get(id);
    req.onsuccess = () => {
      if (!req.result) return resolve(null);
      const blob = new Blob([req.result.data], { type: req.result.type });
      resolve(URL.createObjectURL(blob));
    };
    req.onerror = () => reject(req.error);
  });
}

async function deleteMedia(id) {
  if (!db) return;
  const tx = db.transaction('media', 'readwrite');
  tx.objectStore('media').delete(id);
}

// ===== 工具函数 =====
function $(id) { return document.getElementById(id); }
function esc(str) { return str ? String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : ''; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function formatDate(d) { return d ? new Date(d).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) : ''; }
function formatDateFull(d) { return d ? new Date(d).toLocaleDateString('zh-CN') : ''; }
function daysBetween(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.ceil(ms / (1000 * 60 * 60 * 24)) + 1;
}
function totalFlightMiles() {
  return appData.flights.reduce((sum, f) => sum + (parseFloat(f.distance) || 0), 0);
}
function nextTrip() {
  const today = new Date();
  const upcoming = appData.trips.filter(t => new Date(t.endDate) >= today).sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
  return upcoming[0] || null;
}

// ===== 大圆距离计算（飞行里程） =====
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round(R * c);
}

// ===== 机场坐标（常用） =====
const AIRPORTS = {
  'PEK': [39.9042, 116.4074], 'PKX': [39.5098, 116.4105],
  'SHA': [31.1443, 121.8083], 'PVG': [31.1443, 121.8083],
  'CAN': [23.3959, 113.2988], 'SZX': [22.6393, 113.8107],
  'HKG': [22.3080, 113.9185], 'TPE': [25.0329, 121.5654],
  'NRT': [35.7647, 140.3864], 'HND': [35.5494, 139.7798], 'KIX': [34.4273, 135.2440],
  'ICN': [37.4602, 126.4407], 'SIN': [1.3644, 103.9915],
  'BKK': [13.6900, 100.7501], 'KUL': [2.7456, 101.7072],
  'LHR': [51.4700, -0.4543], 'CDG': [49.0097, 2.5479],
  'JFK': [40.6413, -73.7781], 'LAX': [33.9416, -118.4085],
  'SYD': [-33.9399, 151.1753], 'AKL': [-37.0082, 174.7850],
  'DXB': [25.2532, 55.3657], 'IST': [41.2753, 28.7519]
};

function calcFlightDistance(fromCode, toCode) {
  const a = AIRPORTS[fromCode.toUpperCase()];
  const b = AIRPORTS[toCode.toUpperCase()];
  if (a && b) return haversine(a[0], a[1], b[0], b[1]);
  return 0;
}

function renderDiaryCard(diary) {
  const name = appData.settings.name || 'Jojo 邓';
  const initial = name.charAt(0);
  let mediaHtml = '';
  if (diary.media && diary.media.length > 0) {
    const items = diary.media.map(m => {
      const url = mediaCache[m.id];
      if (m.type.startsWith('video')) {
        return `<video src="${url || ''}" controls preload="metadata" onclick="event.stopPropagation();"></video>`;
      } else {
        return `<img src="${url || ''}" data-media-id="${m.id}" alt="" onclick="event.stopPropagation();viewMedia('${m.id}','${m.type}')">`;
      }
    }).join('');
    mediaHtml = `<div class="diary-media">${items}</div>`;
    // 异步加载未缓存的媒体
    diary.media.forEach(async m => {
      if (!mediaCache[m.id]) {
        mediaCache[m.id] = await loadMedia(m.id);
        const img = document.querySelector(`img[data-media-id="${m.id}"]`);
        if (img) img.src = mediaCache[m.id];
        const videos = document.querySelectorAll(`video[src=""]`);
        videos.forEach(v => { if (v.closest('.diary-media')) v.src = mediaCache[m.id]; });
      }
    });
  }

  return `
    <div class="card diary-card" onclick="editDiary('${diary.id}')">
      <div class="diary-header">
        <div class="diary-avatar">${esc(initial)}</div>
        <div class="diary-meta">
          <div class="diary-title">${esc(diary.title)}</div>
          <div class="diary-date">${formatDateFull(diary.date)} · ${esc(diary.location || '')}</div>
        </div>
      </div>
      <div class="diary-content">${esc(diary.content).replace(/\n/g, '<br>')}</div>
      ${mediaHtml}
    </div>
  `;
}

function viewMedia(id, type) {
  // 全屏查看媒体
  const url = mediaCache[id];
  if (!url) return;
  showModal('查看', type.startsWith('video') ? `<video src="${url}" controls style="width:100%;border-radius:12px;"></video>` : `<img src="${url}" style="width:100%;border-radius:12px;">`, [{ text: '关闭', action: "closeModal();", class: 'btn btn-primary btn-block' }]);
}

function renderBudget() {
  const totalBudget = appData.trips.reduce((s, t) => s + (parseFloat(t.budget) || 0), 0);
  const totalSpent = appData.trips.reduce((s, t) => s + (t.expenses ? t.expenses.reduce((ss, e) => ss + (parseFloat(e.amount) || 0), 0) : 0), 0);
  const cats = {};
  appData.trips.forEach(t => {
    if (t.expenses) t.expenses.forEach(e => {
      cats[e.category] = (cats[e.category] || 0) + (parseFloat(e.amount) || 0);
    });

  const catColors = { transport: '#2d6a4f', stay: '#52b788', food: '#b08968', ticket: '#74c69d', shopping: '#95d5b2', other: '#adb5bd' };

  // 收集所有花销记录（带行程名）
  const allExpenses = [];

      allExpenses.push({ ...e, tripId: t.id, tripTitle: t.title });

  });

  return `
    <div class="page-header">
      <h1>预算与花销</h1>

        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <div style="font-size:12px;color:var(--text-2);">总预算</div>
          <div style="font-size:12px;color:var(--text-2);">已支出</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <div style="font-size:30px;font-weight:700;color:var(--text-1);">¥${totalBudget.toFixed(0)}</div>
          <div style="font-size:24px;font-weight:700;color:var(--primary);">¥${totalSpent.toFixed(0)}</div>
        </div>
        <div style="margin-top:12px;background:var(--border);height:8px;border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${totalBudget > 0 ? Math.min(100, totalSpent/totalBudget*100) : 0}%;background:var(--primary);border-radius:4px;transition:width 0.5s;"></div>
        </div>

      ${appData.trips.length === 0 ? emptyState('暂无预算数据', '创建行程后即可记录花销', ICONS.wallet) : `
        <div class="card">
          <div class="card-header"><h2>支出分类</h2></div>
          <div id="budgetChart" style="height:180px;display:flex;align-items:center;justify-content:center;"></div>
          ${Object.entries(cats).sort((a,b) => b[1]-a[1]).map(([k, v]) => `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
              <div style="width:12px;height:12px;border-radius:50%;background:${catColors[k] || catColors.other};"></div>
              <div style="flex:1;font-size:13px;">${catNames[k] || k}</div>
              <div style="font-weight:600;">¥${v.toFixed(0)}</div>

        <div class="card" style="padding-bottom:24px;">
          <div class="card-header">
            <h2>花销明细</h2>
            <span class="more" onclick="addExpense()">+ 记一笔</span>
          </div>
          ${allExpenses.length === 0 ? `
            <div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px;">
              还没有花销记录<br>
              <span style="color:var(--primary);cursor:pointer;" onclick="addExpense()">点击记一笔</span>

                <div style="width:10px;height:10px;border-radius:50%;background:${catColors[e.category] || catColors.other};margin:auto;"></div>

                <div class="list-title">${esc(e.note || catNames[e.category] || '花销')}</div>

                  <button class="btn btn-sm btn-danger" style="padding:3px 8px;font-size:11px;" onclick="event.stopPropagation();deleteExpense('${e.tripId}','${e.id}')">删除</button>

          `).join('')}
        </div>

        <div class="card">
          <div class="card-header"><h2>按行程</h2></div>

            const spent = t.expenses ? t.expenses.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0) : 0;

                  <div style="font-size:16px;font-weight:700;color:${pct > 90 ? 'var(--danger)' : pct > 70 ? 'var(--warning)' : 'var(--success)'}">${pct.toFixed(0)}%</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

function initBudgetChart() {
  const cats = {};
  appData.trips.forEach(t => {
    if (t.expenses) t.expenses.forEach(e => {
      cats[e.category] = (cats[e.category] || 0) + (parseFloat(e.amount) || 0);
    });
  });
  const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) {
    $('budgetChart').innerHTML = '<div style="color:var(--text-3);font-size:13px;">暂无支出</div>';
    return;
  }
  const total = entries.reduce((s, e) => s + e[1], 0);
  const catColors = { transport: '#2d6a4f', stay: '#52b788', food: '#b08968', ticket: '#74c69d', shopping: '#95d5b2', other: '#adb5bd' };
  // 简单环形图（SVG）
  const r = 60;
  let dashOffset = 0;
  const circles = entries.map(([k, v]) => {
    const pct = v / total;
    const dash = pct * 2 * Math.PI * r;
    const circle = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="${catColors[k] || catColors.other}" stroke-width="18" stroke-dasharray="${dash} ${2*Math.PI*r}" stroke-dashoffset="-${dashOffset}" transform="rotate(-90 90 90)"/>`;
    dashOffset += dash;
    return circle;
  }).join('');
  $('budgetChart').innerHTML = `
    <svg width="180" height="180" viewBox="0 0 180 180">
      ${circles}
      <text x="90" y="85" text-anchor="middle" font-size="12" fill="#9ca3af">总支出</text>
      <text x="90" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1f">¥${total.toFixed(0)}</text>
    </svg>
  `;
}

function renderChecklistItems(list) {
  const checkedCount = list.items.filter(i => i.checked).length;
  const totalCount = list.items.length;
  const pct = totalCount > 0 ? Math.round(checkedCount / totalCount * 100) : 0;

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div>
          <div style="font-size:16px;font-weight:700;">${esc(list.name)}</div>
          <div style="font-size:13px;color:var(--text-2);">已准备 ${checkedCount} / ${totalCount} 项</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-size:14px;font-weight:700;color:${pct >= 100 ? 'var(--primary)' : pct > 50 ? 'var(--success)' : 'var(--warning)'};">${pct}%</div>
          <button class="btn btn-sm btn-secondary" onclick="resetChecklist('${list.id}')">重置</button>
        </div>
      </div>
      <div class="progress-bar" style="margin-bottom:16px;">
        <div class="progress-fill" style="width:${pct}%;background:${pct >= 100 ? 'var(--primary)' : pct > 50 ? 'var(--success)' : 'var(--warning)'}"></div>
      </div>
      ${list.items.map(item => `
        <div class="check-item">
          <div class="check-box ${item.checked ? 'checked' : ''}" onclick="toggleCheckItem('${list.id}','${item.id}')">
            ${item.checked ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
          </div>
          <div class="check-name ${item.checked ? 'checked' : ''}">${esc(item.name)}</div>
          <div class="check-actions">
            <button class="btn btn-sm btn-secondary" onclick="editChecklistItem('${list.id}','${item.id}')" style="padding:3px 6px;font-size:11px;">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="removeChecklistItem('${list.id}','${item.id}')" style="padding:3px 6px;font-size:11px;">删除</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function selectChecklist(listId) {
  activeChecklistId = listId;
  renderApp();
}

function toggleCheckItem(listId, itemId) {
  const list = appData.checklists.find(l => l.id === listId);
  if (!list) return;
  const item = list.items.find(i => i.id === itemId);
  if (!item) return;
  item.checked = !item.checked;
  saveData();
  renderApp();
}

function resetChecklist(listId) {
  const list = appData.checklists.find(l => l.id === listId);
  if (!list) return;
  list.items.forEach(i => i.checked = false);
  saveData();
  renderApp();
  toast('清单已重置');
}

function addChecklistItem() {
  const lists = appData.checklists || [];
  if (lists.length === 0) { toast('请先创建一个清单场景'); return; }
  const listOptions = lists.map(l => `<option value="${l.id}" ${activeChecklistId === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('');

  modalContext = { type: 'checklistItem' };
  showModal('添加物品', `
    <div class="form-group">
      <label class="form-label">所属清单</label>
      <select class="form-select" id="itemList">${listOptions}</select>
    </div>
    <div class="form-group">
      <label class="form-label">物品名称</label>
      <input type="text" class="form-input" id="itemName" placeholder="例如：防晒霜">
    </div>
  `, [
    { text: '保存', action: "saveChecklistItem();", class: 'btn btn-primary', block: true },
    { text: '取消', action: "closeModal();", class: 'btn btn-secondary', block: true }
  ]);
}

function saveChecklistItem() {
  const listId = $('itemList').value;
  const name = $('itemName').value.trim();
  if (!name) return toast('请输入物品名称');
  const list = appData.checklists.find(l => l.id === listId);
  if (!list) return;
  list.items.push({ id: uid(), name, checked: false });
  activeChecklistId = listId;
  saveData();
  renderApp();
  toast('已添加');
}

function editChecklistItem(listId, itemId) {
  const list = appData.checklists.find(l => l.id === listId);
  if (!list) return;

function deleteChecklistItem() {

}

function renderGuides() {
  return `
    <div class="page-header">
      <h1>路书</h1>
      <div class="subtitle">${GUIDES.length} 份路书 · 来自视频与攻略整理</div>
    </div>
    <div class="content">
      ${GUIDES.map(g => `
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px;">
          <div onclick="toggleGuide('${g.id}')" style="cursor:pointer;padding:16px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="width:48px;height:48px;border-radius:12px;background:${g.color};display:flex;align-items:center;justify-content:center;font-size:24px;">${g.banner}</div>
              <div style="flex:1;">
                <div style="font-size:16px;font-weight:700;">${esc(g.title)}</div>
                <div style="font-size:12px;color:var(--text-2);margin-top:2px;">${esc(g.subtitle)}</div>
              </div>
              <div style="color:var(--text-3);font-size:20px;" id="guide-arrow-${g.id}">›</div>
            </div>
            <div style="font-size:12px;color:var(--text-3);margin-top:8px;">${esc(g.summary)}</div>
          </div>
          <div id="guide-detail-${g.id}" style="display:none;padding:0 16px 16px;border-top:1px solid var(--border);">
            ${g.note ? `<div style="font-size:13px;color:var(--text-2);background:var(--primary-bg);padding:10px 12px;border-radius:10px;margin:12px 0;line-height:1.5;">⚠️ ${esc(g.note)}</div>` : ''}
            ${g.days.map(d => `
              <div class="day-card" style="margin:8px 0;">
                <h4 style="font-size:14px;color:var(--primary);">Day ${d.day} · ${esc(d.title)}</h4>
                <div style="font-size:13px;color:var(--text-2);line-height:1.5;margin:6px 0;">${esc(d.desc)}</div>
                ${d.highlights ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">${d.highlights.map(h => `<span style="font-size:11px;padding:3px 8px;background:${g.color};border-radius:10px;">${esc(h)}</span>`).join('')}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function toggleGuide(id) {
  const detail = document.getElementById('guide-detail-' + id);
  const arrow = document.getElementById('guide-arrow-' + id);
  if (detail.style.display === 'none') {
    detail.style.display = 'block';
    arrow.textContent = '⌄';
    arrow.style.transform = 'rotate(180deg)';
  } else {
    detail.style.display = 'none';
    arrow.textContent = '›';
    arrow.style.transform = '';
  }
}

function getCityCoord(cityName) {
  // 先查缓存
  if (CITY_COORDS[cityName]) return CITY_COORDS[cityName];
  // 再查行程数据中的已有坐标
  const trip = appData.trips.find(t => t.destination === cityName);
  if (trip && trip.coord) return trip.coord;
  // 返回 null 表示需要地理编码
  return null;
}

async function geocodeCity(cityName) {
  if (CITY_COORDS[cityName]) return CITY_COORDS[cityName];
  if (!geocoder) {
    try { geocoder = new AMap.Geocoder(); } catch(e) { return null; }
  }
  return new Promise(resolve => {
    geocoder.getLocation(cityName, (status, result) => {
      if (status === 'complete' && result.geocodes && result.geocodes.length > 0) {
        const loc = result.geocodes[0].location;
        const coord = [loc.lng, loc.lat];
        CITY_COORDS[cityName] = coord; // 缓存
        resolve(coord);
      } else {
        resolve(null);
      }
    });
  });
}

async function initMap() {
  const container = document.getElementById('travelMap');
  if (!container) return;
  // 销毁旧实例
  if (amapInstance) { amapInstance.destroy(); amapInstance = null; }
  mapMarkers = [];

  try {
    amapInstance = new AMap.Map('travelMap', {
      zoom: 3,
      center: [108, 34], // 中国中心
      mapStyle: 'amap://styles/whitesmoke',
      viewMode: '2D',
    });

    // 添加足迹标记
    for (const trip of appData.trips) {
      const city = trip.destination;
      let coord = getCityCoord(city);
      if (!coord) coord = await geocodeCity(city);
      if (coord) {
        const marker = new AMap.Marker({
          position: coord,
          title: city,
          content: `<div style="background:var(--primary);color:white;font-size:11px;padding:3px 8px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">${esc(city)}</div>`,
          offset: new AMap.Pixel(-20, -15),
        });
        marker.on('click', () => {
          amapInstance.setZoomAndCenter(10, coord);
        });
        amapInstance.add(marker);
        mapMarkers.push(marker);
      }
    }

    // 添加想去标记（空心心形样式）
    for (const wish of appData.wishlist) {
      const city = wish.name;
      let coord = getCityCoord(city);
      if (!coord) coord = await geocodeCity(city);
      if (coord) {
        const marker = new AMap.Marker({
          position: coord,
          title: city,
          content: `<div style="background:#b08968;color:white;font-size:11px;padding:3px 8px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">♡ ${esc(city)}</div>`,
          offset: new AMap.Pixel(-20, -15),
        });
        amapInstance.add(marker);
        mapMarkers.push(marker);
      }
    }

    // 自动调整视野覆盖所有标记
    if (mapMarkers.length > 0) {
      amapInstance.setFitView(mapMarkers, false, [60, 60, 60, 60]);
    }
  } catch (e) {
    console.error('地图初始化失败', e);
    container.innerHTML = `<div style="height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-2);padding:20px;">
      <div style="font-size:15px;color:var(--danger);">地图加载失败</div>
      <div style="font-size:13px;margin-top:6px;">请检查网络或高德 API Key 配置</div>
    </div>`;
  }
}

function panToCity(cityName) {
  if (!amapInstance) return;
  const coord = getCityCoord(cityName) || CITY_COORDS[cityName];
  if (coord) {
    amapInstance.setZoomAndCenter(10, coord);
  } else {
    geocodeCity(cityName).then(c => {
      if (c) amapInstance.setZoomAndCenter(10, c);
    });
  }
}

async function doMapSearch() {
  const input = document.getElementById('mapSearchInput');
  if (!input) return;
  const keyword = input.value.trim();
  if (!keyword) return;
  if (!amapInstance) return;

  // 城市级别搜索优先用地理编码，更准确
  const coord = await geocodeCity(keyword);
  if (coord) {
    amapInstance.setZoomAndCenter(12, coord);
    const marker = new AMap.Marker({
      position: coord,
      title: keyword,
      content: `<div style="background:var(--accent);color:white;font-size:12px;padding:4px 10px;border-radius:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.25);">${esc(keyword)}</div>`,
      offset: new AMap.Pixel(-25, -18),
    });
    amapInstance.add(marker);
    toast('定位到：' + keyword);
    return;
  }

  // 降级用 POI 搜索
  try {
    const placeSearch = new AMap.PlaceSearch({ city: '全国', citylimit: false });
    placeSearch.search(keyword, (status, result) => {
      if (status === 'complete' && result.poiList && result.poiList.pois.length > 0) {
        const poi = result.poiList.pois[0];
        const c = [poi.location.lng, poi.location.lat];
        amapInstance.setZoomAndCenter(12, c);
        const marker = new AMap.Marker({
          position: c,
          title: poi.name,
          content: `<div style="background:var(--accent);color:white;font-size:12px;padding:4px 10px;border-radius:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.25);">${esc(poi.name)}</div>`,
          offset: new AMap.Pixel(-25, -18),
        });
        amapInstance.add(marker);
        toast('找到：' + poi.name);
      } else {
        toast('未找到该地点');
      }
    });
  } catch (e) {
    toast('未找到该地点');
  }
}

let modalContext = null;

function showModal(title, content, actions = []) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>${title}</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${content}</div>
      ${actions.length ? `<div style="display:flex;gap:10px;margin-top:20px;">${actions.map(a => {
        let onClick = '';
        if (typeof a.action === 'string') {
          onClick = a.action.includes('closeModal') ? a.action : `${a.action}; closeModal();`;
        } else {
          onClick = `(${a.action.toString()})(); closeModal();`;
        }
        return `<button class="btn ${a.class || 'btn-secondary'}" style="flex:${a.block ? 1 : 'none'};" onclick="${onClick}">${a.text}</button>`;
      }).join('')}</div>` : ''}
    </div>
  `;
  overlay.addEventListener('click', closeModal);
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalContext = null;
  const overlay = $('modalOverlay');
  if (overlay) { overlay.remove(); document.body.style.overflow = ''; }
}

function saveTrip() {
  const tripId = modalContext && modalContext.tripId ? modalContext.tripId : null;
  const title = $('tripTitle').value.trim();
  if (!title) return toast('请输入行程名称');
  const activities = [];
  $('tripActivities').querySelectorAll('div[data-idx], div:not([data-idx])').forEach(row => {
    const inputs = row.querySelectorAll('input');
    if (inputs[2] && inputs[2].value.trim()) {
      activities.push({
        day: parseInt(inputs[0].value) || 1,
        time: inputs[1].value || '',
        title: inputs[2].value.trim(),
        desc: (inputs[3] ? inputs[3].value.trim() : '')
      });
    }
  });
  const newTrip = {
    id: tripId || uid(),
    title,
    startDate: $('tripStart').value,
    endDate: $('tripEnd').value,
    destination: $('tripDest').value.trim(),
    country: $('tripCountry').value.trim(),
    budget: parseFloat($('tripBudget').value) || 0,
    activities,
    expenses: tripId ? (appData.trips.find(t => t.id === tripId).expenses || []) : []
  };
  if (tripId) {
    const idx = appData.trips.findIndex(t => t.id === tripId);
    appData.trips[idx] = newTrip;
  } else {
    appData.trips.push(newTrip);
  }
  saveData();
  renderApp();
  toast('已保存');
}

function deleteTrip(id) {
  appData.trips = appData.trips.filter(t => t.id !== id);

  renderApp();
  toast('已删除');
}

    { text: '保存', action: "saveDiary();", class: 'btn btn-primary', block: true }
  ]);
  // 加载已有媒体的 blob url
  if (diary && diary.media) {
    diary.media.forEach(async m => {
      if (!mediaCache[m.id]) mediaCache[m.id] = await loadMedia(m.id);

    });
  }

async function handleDiaryMedia(input) {
  const files = Array.from(input.files);
  for (const file of files) {
    const id = uid();
    await saveMedia(id, file);
    mediaCache[id] = URL.createObjectURL(file);
    currentDiaryMedia.push({ id, type: file.type });
  }
  refreshDiaryMediaGrid();
}

function refreshDiaryMediaGrid() {
  const grid = $('diaryMediaGrid');
  if (!grid) return;
  grid.innerHTML = currentDiaryMedia.map(m => `
    <div class="media-item" data-id="${m.id}" onclick="removeDiaryMedia('${m.id}')">
      ${m.type.startsWith('video') ? `<video src="${mediaCache[m.id] || ''}"></video>` : `<img src="${mediaCache[m.id] || ''}" alt="">`}
    </div>
  `).join('') + `
    <label class="media-add">
      ${ICONS.camera}
      <span style="font-size:11px;">添加</span>
      <input type="file" accept="image/*,video/*" multiple style="display:none;" onchange="handleDiaryMedia(this)">
    </label>
  `;
}

function removeDiaryMedia(id) {
  currentDiaryMedia = currentDiaryMedia.filter(m => m.id !== id);
  if (mediaCache[id]) URL.revokeObjectURL(mediaCache[id]);
  delete mediaCache[id];
  refreshDiaryMediaGrid();
}

async function saveDiary() {
  const diaryId = modalContext && modalContext.diaryId ? modalContext.diaryId : null;
  const title = $('diaryTitle').value.trim();
  if (!title) return toast('请输入标题');
  const newDiary = {
    id: diaryId || uid(),
    title,
    date: $('diaryDate').value,
    location: $('diaryLocation').value.trim(),
    content: $('diaryContent').value.trim(),
    media: currentDiaryMedia
  };
  if (diaryId) {
    const old = appData.diaries.find(d => d.id === diaryId);
    // 删除被移除的旧媒体
    if (old && old.media) {
      for (const m of old.media) {
        if (!currentDiaryMedia.find(cm => cm.id === m.id)) {
          await deleteMedia(m.id);
          if (mediaCache[m.id]) URL.revokeObjectURL(mediaCache[m.id]);
          delete mediaCache[m.id];
        }
      }
    }
    const idx = appData.diaries.findIndex(d => d.id === diaryId);
    appData.diaries[idx] = newDiary;
  } else {
    appData.diaries.push(newDiary);
  }
  saveData();
  renderApp();
  toast('已保存');
}

async function deleteDiary(id) {
  const diary = appData.diaries.find(d => d.id === id);
  if (diary && diary.media) {
    for (const m of diary.media) {
      await deleteMedia(m.id);
      if (mediaCache[m.id]) URL.revokeObjectURL(mediaCache[m.id]);
      delete mediaCache[m.id];
    }
  }
  appData.diaries = appData.diaries.filter(d => d.id !== id);
  saveData();
  renderApp();
  toast('已删除');
}

// ===== 航班表单 =====
function editFlight(flightId = null) {
  const f = flightId ? appData.flights.find(x => x.id === flightId) : null;
  modalContext = { type: 'flight', flightId };
  showModal(flightId ? '编辑航班' : '添加航班', `
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">出发机场代码</label>
        <input type="text" class="form-input" id="flightFrom" value="${esc(f ? f.from : '')}" placeholder="PEK">
      </div>
      <div class="form-group">
        <label class="form-label">到达机场代码</label>
        <input type="text" class="form-input" id="flightTo" value="${esc(f ? f.to : '')}" placeholder="NRT">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">出发城市</label>
        <input type="text" class="form-input" id="flightFromCity" value="${esc(f ? f.fromCity : '')}" placeholder="北京">
      </div>
      <div class="form-group">
        <label class="form-label">到达城市</label>
        <input type="text" class="form-input" id="flightToCity" value="${esc(f ? f.toCity : '')}" placeholder="东京">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">航班号</label>
        <input type="text" class="form-input" id="flightNo" value="${esc(f ? f.flightNo : '')}" placeholder="CA123">
      </div>
      <div class="form-group">
        <label class="form-label">日期</label>
        <input type="date" class="form-input" id="flightDate" value="${f ? f.date : new Date().toISOString().split('T')[0]}">
      </div>
    </div>
    <div style="font-size:12px;color:var(--text-3);line-height:1.5;">
      支持的机场代码：PEK(北京)、SHA/PVG(上海)、CAN(广州)、HKG(香港)、NRT/HND(东京)、ICN(首尔)、SIN(新加坡)、BKK(曼谷)、LHR(伦敦)、CDG(巴黎)、JFK(纽约)、LAX(洛杉矶)、SYD(悉尼) 等
    </div>
  `, [
    { text: '取消', action: "closeModal();", class: 'btn btn-secondary', block: true },
    { text: '保存', action: "saveFlight();", class: 'btn btn-primary', block: true }
  ]);
}

function saveFlight() {
  const flightId = modalContext && modalContext.flightId ? modalContext.flightId : null;
  const from = $('flightFrom').value.trim().toUpperCase();
  const to = $('flightTo').value.trim().toUpperCase();
  if (!from || !to) return toast('请输入机场代码');
  const distance = calcFlightDistance(from, to);
  const newFlight = {
    id: flightId || uid(),
    from,
    to,
    fromCity: $('flightFromCity').value.trim(),
    toCity: $('flightToCity').value.trim(),
    flightNo: $('flightNo').value.trim(),
    date: $('flightDate').value,
    distance
  };
  if (flightId) {
    const idx = appData.flights.findIndex(x => x.id === flightId);
    appData.flights[idx] = newFlight;
  } else {
    appData.flights.push(newFlight);
  }
  saveData();
  renderApp();
  toast(distance ? `已保存 · 飞行距离 ${distance} km` : '已保存（未能识别机场代码，未计算距离）');
}

function deleteFlight(id) {
  appData.flights = appData.flights.filter(f => f.id !== id);
  saveData();
  renderApp();
  toast('已删除');
}

// ===== 花销管理 =====
function addExpense(tripId = null) {
  if (appData.trips.length === 0) {
    toast('请先创建行程');
    return;
  }
  const tripOptions = appData.trips.map(t => `<option value="${t.id}" ${tripId === t.id ? 'selected' : ''}>${esc(t.title)}</option>`).join('');
  const today = new Date().toISOString().split('T')[0];

  showModal('记一笔花销', `
    <div class="form-group">
      <label class="form-label">所属行程</label>
      <select class="form-select" id="expTrip">
        ${tripOptions}
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">金额</label>
        <input type="number" class="form-input" id="expAmount" placeholder="0" step="0.01" inputmode="decimal">
      </div>
      <div class="form-group">
        <label class="form-label">分类</label>
        <select class="form-select" id="expCategory">
          <option value="transport">交通</option>
          <option value="stay">住宿</option>
          <option value="food">餐饮</option>
          <option value="ticket">门票</option>
          <option value="shopping">购物</option>
          <option value="other">其他</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="expDate" value="${today}">
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <input type="text" class="form-input" id="expNote" placeholder="例如：京都到东京新干线">
    </div>
  `, [
    { text: '取消', action: "closeModal();", class: 'btn btn-secondary', block: true },
    { text: '保存', action: "saveExpense();", class: 'btn btn-primary', block: true }
  ]);
}

function saveExpense() {
  const tripId = $('expTrip').value;
  const amount = parseFloat($('expAmount').value);
  if (!amount || amount <= 0) return toast('请输入有效金额');
  const category = $('expCategory').value;
  const date = $('expDate').value;
  const note = $('expNote').value.trim();

  const trip = appData.trips.find(t => t.id === tripId);
  if (!trip) return toast('行程不存在');
  if (!trip.expenses) trip.expenses = [];
  trip.expenses.push({
    id: uid(),
    amount,
    category,
    date,
    note
  });
  saveData();
  renderApp();
  toast('已记录 ¥' + amount.toFixed(0));
}

function deleteExpense(tripId, expenseId) {
  const trip = appData.trips.find(t => t.id === tripId);
  if (!trip || !trip.expenses) return;
  trip.expenses = trip.expenses.filter(e => e.id !== expenseId);
  saveData();
  renderApp();
  toast('已删除');
}

function editExpense(tripId, expenseId) {
  const trip = appData.trips.find(t => t.id === tripId);
  if (!trip || !trip.expenses) return toast('行程未找到');
  const exp = trip.expenses.find(e => e.id === expenseId);
  if (!exp) return toast('记录未找到');

  const tripOptions = appData.trips.map(t => `<option value="${t.id}" ${tripId === t.id ? 'selected' : ''}>${esc(t.title)}</option>`).join('');

  modalContext = { type: 'expense', tripId, expenseId };
  showModal('编辑花销', `
    <div class="form-group">
      <label class="form-label">所属行程</label>
      <select class="form-select" id="expTrip">${tripOptions}</select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">金额</label>
        <input type="number" class="form-input" id="expAmount" value="${exp.amount}" step="0.01" inputmode="decimal">
      </div>
      <div class="form-group">
        <label class="form-label">分类</label>
        <select class="form-select" id="expCategory">
          <option value="transport" ${exp.category === 'transport' ? 'selected' : ''}>交通</option>
          <option value="stay" ${exp.category === 'stay' ? 'selected' : ''}>住宿</option>
          <option value="food" ${exp.category === 'food' ? 'selected' : ''}>餐饮</option>
          <option value="ticket" ${exp.category === 'ticket' ? 'selected' : ''}>门票</option>
          <option value="shopping" ${exp.category === 'shopping' ? 'selected' : ''}>购物</option>
          <option value="other" ${exp.category === 'other' ? 'selected' : ''}>其他</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="expDate" value="${exp.date || ''}">
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <input type="text" class="form-input" id="expNote" value="${esc(exp.note || '')}" placeholder="例如：京都到东京新干线">
    </div>
  `, [
    { text: '删除', action: "if (modalContext) deleteExpense(modalContext.tripId, modalContext.expenseId);", class: 'btn btn-danger' },
    { text: '保存', action: "saveExpenseEdit();", class: 'btn btn-primary', block: true }
  ]);
}

function saveExpenseEdit() {
  const tripId = modalContext && modalContext.tripId ? modalContext.tripId : null;
  const expenseId = modalContext && modalContext.expenseId ? modalContext.expenseId : null;
  if (!tripId || !expenseId) return;
  const trip = appData.trips.find(t => t.id === tripId);
  if (!trip || !trip.expenses) return;
  const exp = trip.expenses.find(e => e.id === expenseId);
  if (!exp) return;

  const amount = parseFloat($('expAmount').value);
  if (!amount || amount <= 0) return toast('请输入有效金额');

  // 如果改了所属行程，需要迁移
  const newTripId = $('expTrip').value;
  if (newTripId !== tripId) {
    trip.expenses = trip.expenses.filter(e => e.id !== expenseId);
    const newTrip = appData.trips.find(t => t.id === newTripId);
    if (!newTrip.expenses) newTrip.expenses = [];
    newTrip.expenses.push({
      id: expenseId,
      amount,
      category: $('expCategory').value,
      date: $('expDate').value,
      note: $('expNote').value.trim()
    });
  } else {
    exp.amount = amount;
    exp.category = $('expCategory').value;
    exp.date = $('expDate').value;
    exp.note = $('expNote').value.trim();
  }
  saveData();
  renderApp();
  toast('已更新');
}

// ===== 个人资料 =====
function editProfile() {
  showModal('编辑资料', `
    <div class="form-group">
      <label class="form-label">昵称</label>
      <input type="text" class="form-input" id="profileName" value="${esc(appData.settings.name)}" placeholder="你的昵称">
    </div>
  `, [
    { text: '取消', action: "closeModal();", class: 'btn btn-secondary', block: true },
    { text: '保存', action: "saveProfile();", class: 'btn btn-primary', block: true }
  ]);
}

function saveProfile() {
  appData.settings.name = $('profileName').value.trim() || 'Jojo 邓';
  saveData();
  renderApp();
  toast('已保存');
}

// ===== 数据导出/导入 =====
function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `travel-app-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

function importData() {
  showModal('导入数据', `
    <div class="form-group">
      <label class="form-label">选择备份文件</label>
      <input type="file" class="form-input" id="importFile" accept="application/json">
    </div>
    <div style="font-size:12px;color:var(--danger);line-height:1.5;">
      注意：导入会覆盖当前所有数据，请确保已备份。
    </div>
  `, [
    { text: '取消', action: "closeModal();", class: 'btn btn-secondary', block: true },
    { text: '导入', action: "doImport();", class: 'btn btn-primary', block: true }
  ]);
}

function doImport() {
  const file = $('importFile').files[0];
  if (!file) return toast('请选择文件');
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      appData = { ...DEFAULT_DATA, ...data };
      saveData();
      // 重新加载媒体
      mediaCache = {};
      for (const d of appData.diaries) {
        if (d.media) {
          for (const m of d.media) {
            if (!mediaCache[m.id]) mediaCache[m.id] = await loadMedia(m.id);
          }
        }
      }
      renderApp();
      toast('导入成功');
    } catch (err) {
      toast('文件格式错误');
      console.error(err);
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  showModal('确认清空', `
    <div style="font-size:14px;line-height:1.6;">
      确定要清空所有数据吗？<br>
      <span style="color:var(--danger);">此操作不可恢复，建议先导出备份。</span>
    </div>
  `, [
    { text: '取消', action: "closeModal();", class: 'btn btn-secondary', block: true },
    { text: '确认清空', action: "confirmClearAll();", class: 'btn btn-danger', block: true }
  ]);
}

function confirmClearAll() {
  appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
  if (db) {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').clear();
  }
  mediaCache = {};
  renderApp();
  toast('已清空');
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', async () => {
  try {
    db = await openDB();
  } catch (e) {
    console.warn('IndexedDB 不可用', e);
  }
  loadData();
  renderApp();
});

// ===== PWA 注册 =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('Service Worker registered', reg.scope))
      .catch((err) => console.log('SW error', err));
  });
}
